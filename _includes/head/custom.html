<!-- Apply saved / system color theme before first paint -->
<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) { /* storage unavailable */ }
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- Pick the language before first paint: ?lang= > saved choice > browser language -->
<script>
  (function () {
    var lang = null;
    var m = /[?&]lang=(en|zh)\b/.exec(location.search);
    if (m) {
      lang = m[1];
      try { localStorage.setItem('lang', lang); } catch (e) { /* storage unavailable */ }
    } else {
      try { lang = localStorage.getItem('lang'); } catch (e) { /* storage unavailable */ }
    }
    if (lang !== 'en' && lang !== 'zh') {
      lang = /^zh\b/i.test(navigator.language || '') ? 'zh' : 'en';
    }
    var root = document.documentElement;
    root.setAttribute('data-lang', lang);
    root.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
  })();
</script>
